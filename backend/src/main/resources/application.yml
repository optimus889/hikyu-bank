server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
spring:
  application:
    name: hikyu-bank
  datasource:
    url: ${HIKYU_DB_URL:jdbc:postgresql://localhost:5432/hikyu_bank}
    username: ${HIKYU_DB_USER:hikyu}
    password: ${HIKYU_DB_PASSWORD:hikyu_local_demo}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    default-schema: hikyu
    schemas: hikyu
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
hikyu:
  database-mode: ${HIKYU_DB_MODE:local}
  uuid-migration-approved: ${HIKYU_UUID_MIGRATION_APPROVED:false}
  demo:
    seed-enabled: ${HIKYU_SEED_ENABLED:true}
    password: ${HIKYU_DEMO_PASSWORD:HikyuDemo2026!}
  extension-migration-approved: ${HIKYU_EXTENSION_MIGRATION_APPROVED:false}
  ai:
    mode: ${HIKYU_AI_MODE:demo}
    key: ${HIKYU_AI_KEY:}
    model: ${HIKYU_AI_MODEL:}
    url: ${HIKYU_AI_URL:https://api.openai.com/v1/chat/completions}
    timeout-seconds: ${HIKYU_AI_TIMEOUT_SECONDS:10}
    max-tokens: ${HIKYU_AI_MAX_TOKENS:512}
    requests-per-minute: ${HIKYU_AI_REQUESTS_PER_MINUTE:10}
    allow-local-http: ${HIKYU_AI_ALLOW_LOCAL_HTTP:false}
